<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Trips</h2>
    <button type="button" class="btn btn-primary" (click)="addTrip()">Add Trip</button>
  </div>

  <div class="row" *ngIf="trips.length; else noTrips">
    <div *ngFor="let trip of trips" class="col-md-4 mb-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>

  <ng-template #noTrips>
    <p class="text-muted">No trips are available.</p>
  </ng-template>
</div>

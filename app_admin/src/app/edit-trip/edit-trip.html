<main class="container mt-4 mb-5">
  <h2>Edit Trip</h2>
  <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>

  <form [formGroup]="tripForm" (ngSubmit)="saveTrip()" novalidate *ngIf="!errorMessage">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label" for="code">Code</label><input id="code" class="form-control" formControlName="code"><div class="form-text">Trip code cannot be changed.</div></div>
      <div class="col-md-8"><label class="form-label" for="name">Name</label><input id="name" class="form-control" formControlName="name"><div class="text-danger small" *ngIf="tripForm.controls.name.touched && tripForm.controls.name.invalid">Name is required.</div></div>
      <div class="col-md-4"><label class="form-label" for="length">Length</label><input id="length" class="form-control" formControlName="length"><div class="text-danger small" *ngIf="tripForm.controls.length.touched && tripForm.controls.length.invalid">Length is required.</div></div>
      <div class="col-md-4"><label class="form-label" for="start">Start date</label><input id="start" type="date" class="form-control" formControlName="start"><div class="text-danger small" *ngIf="tripForm.controls.start.touched && tripForm.controls.start.invalid">Start date is required.</div></div>
      <div class="col-md-4"><label class="form-label" for="resort">Resort</label><input id="resort" class="form-control" formControlName="resort"><div class="text-danger small" *ngIf="tripForm.controls.resort.touched && tripForm.controls.resort.invalid">Resort is required.</div></div>
      <div class="col-md-6"><label class="form-label" for="perPerson">Price per person</label><input id="perPerson" class="form-control" formControlName="perPerson"><div class="text-danger small" *ngIf="tripForm.controls.perPerson.touched && tripForm.controls.perPerson.invalid">Price is required.</div></div>
      <div class="col-md-6"><label class="form-label" for="image">Image filename</label><input id="image" class="form-control" formControlName="image"><div class="text-danger small" *ngIf="tripForm.controls.image.touched && tripForm.controls.image.invalid">Image is required.</div></div>
      <div class="col-12"><label class="form-label" for="description">Description</label><textarea id="description" rows="4" class="form-control" formControlName="description"></textarea><div class="text-danger small" *ngIf="tripForm.controls.description.touched && tripForm.controls.description.invalid">Description is required.</div></div>
    </div>
    <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary">Save Changes</button><button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button></div>
  </form>
</main>

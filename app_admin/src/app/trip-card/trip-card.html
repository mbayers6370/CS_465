<div class="card h-100">
  <img
    src="/images/{{ trip.image }}"
    class="card-img-top"
    alt="{{ trip.name }}"
  />

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-text">
      {{ trip.length }} | {{ trip.perPerson }}
    </p>

    <p class="card-text">
      {{ trip.start }}
    </p>

    <button type="button" class="btn btn-outline-primary" (click)="editTrip()">Edit Trip</button>
  </div>
</div>
